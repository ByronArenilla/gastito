# Despliegue provisional en Render (etapa 014, ADR 0020).
#
# Este archivo es un "Blueprint": describe los servicios como código. En
# Render: New > Blueprint > este repositorio. Render crea lo que aquí dice y
# lo vuelve a aplicar con cada cambio del archivo.
# https://render.com/docs/blueprint-spec
#
# Todo en el plan gratuito. La base de datos no está aquí: es un PostgreSQL de
# Neon, y la API solo conoce su URL.
#
# LAS TRES URL DE ABAJO DEPENDEN DE LA DIRECCIÓN QUE RENDER ASIGNÓ. Render
# publica cada servicio en https://<name>.onrender.com, pero `gastito-api` y
# `gastito-web` ya eran de otra aplicación, así que les añadió un sufijo. Son
# las tres líneas marcadas con "URL": si un servicio se recrea, su sufijo
# cambia y hay que corregirlas. Una dirección equivocada no es inofensiva: la
# web enviaría las contraseñas a la API de otra persona.

services:
  # --- API: contenedor construido desde services/api/Dockerfile -------------
  - type: web
    name: gastito-api
    runtime: docker
    # El plan gratuito duerme el servicio tras 15 minutos sin peticiones;
    # despertar tarda cerca de un minuto. Da 750 horas al mes, suficientes
    # para un servicio despierto todo el mes. https://render.com/docs/free
    plan: free
    # La región más cercana a Colombia. La base de Neon debe quedar en la
    # misma zona (AWS US East, N. Virginia) para que cada consulta no cruce
    # el país. No se puede cambiar después de crear el servicio.
    region: virginia
    dockerfilePath: ./services/api/Dockerfile
    dockerContext: ./services/api
    # Render da por bueno un despliegue cuando esta ruta responde 200; si la
    # versión nueva no arranca (por ejemplo, falla una migración), deja
    # corriendo la anterior.
    healthCheckPath: /health
    # Cada commit en la rama del Blueprint despliega solo.
    autoDeployTrigger: commit
    envVars:
      # `sync: false`: el valor NO está en el repositorio (principio 12).
      # Render lo pide una vez, al crear el Blueprint. Es la URL de conexión
      # de Neon, tal cual la entrega.
      - key: DATABASE_URL
        sync: false
      - key: TZ
        value: America/Bogota
      # URL de la web: único origen que la API acepta (CORS) y base de los
      # enlaces de invitación.
      - key: WEB_BASE_URL
        value: https://gastito-web-2dx5.onrender.com
      # La API está detrás del proxy de Render, que es quien recibe el HTTPS.
      # Con esto uvicorn confía en las cabeceras X-Forwarded-* del proxy y
      # sabe que la petición original llegó por https (si no, sus
      # redirecciones saldrían con http). Es seguro porque al contenedor solo
      # se llega a través de ese proxy.
      # https://www.uvicorn.org/deployment/#proxies-and-forwarded-headers
      - key: FORWARDED_ALLOW_IPS
        value: "*"

  # --- Web: sitio estático, sin contenedor ----------------------------------
  # Gratis y no se duerme. Hace lo mismo que services/web/serve.py; si cambia
  # una regla allá, hay que cambiarla aquí.
  - type: web
    name: gastito-web
    runtime: static
    # La web no se compila: lo único que se genera es /config.js con la URL
    # de la API, igual que `config_module` en serve.py.
    buildCommand: printf 'export const API_URL = "%s";\n' "$API_URL" > services/web/public/config.js
    staticPublishPath: ./services/web/public
    envVars:
      # URL de la API.
      - key: API_URL
        value: https://gastito-api-33vd.onrender.com
    routes:
      # Las pantallas de la app (/registrar, /unirse/<token>...) no son
      # archivos: se responde index.html y la app decide qué mostrar. Render
      # solo aplica la regla si no existe un archivo en esa ruta.
      - type: rewrite
        source: /*
        destination: /index.html
    headers:
      # Las mismas cabeceras de `security_headers` en serve.py (spec 011,
      # RF-37). La CSP protege el token guardado en el navegador: solo se
      # carga lo propio y solo se conecta a la API.
      - path: /*
        name: Content-Security-Policy
        # URL de la API, en `connect-src`.
        value: "default-src 'none'; script-src 'self'; style-src 'self'; font-src 'self'; img-src 'self' data:; manifest-src 'self'; connect-src https://gastito-api-33vd.onrender.com; base-uri 'none'; form-action 'self'; frame-ancestors 'none'"
      - path: /*
        name: X-Content-Type-Options
        value: nosniff
      - path: /*
        name: Referrer-Policy
        value: no-referrer
      # Los archivos no llevan versión en el nombre: el navegador pregunta
      # siempre si hay uno más nuevo, y así un despliegue se ve al instante.
      - path: /*
        name: Cache-Control
        value: no-cache
