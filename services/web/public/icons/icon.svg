<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <!-- El logo de Gastito: un recibo (un gasto pequeño) con su borde dentado,
       un renglón en tinta y la doble raya roja con la que un libro auxiliar
       cierra un total. Mismos colores que tokens.css (tema claro). El mismo
       dibujo está en index.html (<symbol id="logo">), donde toma los colores
       del tema. -->
  <rect width="512" height="512" rx="96" fill="#e9eee6"/>
  <g transform="translate(64 64) scale(6)" fill="none" stroke-linecap="butt" stroke-linejoin="miter">
    <path d="M14 6.5H50V52L44 57.5L38 52L32 57.5L26 52L20 57.5L14 52Z" stroke="#18233a" stroke-width="5"/>
    <path d="M23 19H41" stroke="#18233a" stroke-width="4.5"/>
    <path d="M23 31H41M23 38.5H41" stroke="#a8241c" stroke-width="3.5"/>
  </g>
</svg>
